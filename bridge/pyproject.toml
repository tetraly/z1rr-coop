[project]
name = "z1rr-coop-bridge"
version = "2.0.0b8"
description = "Bridge that lets real NES endpoints participate in Z1RR-coop sessions"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "customtkinter>=5.2",
  "paramiko>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "py65>=1.1"]
dist = ["pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bridge_core", "bridge_core.modes", "bridge_cli", "bridge_gui"]

[tool.setuptools.package-data]
"bridge_core" = ["patches/*.ips", "patches/*.json", "mister_payload/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
